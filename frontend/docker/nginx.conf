# nginx interne au conteneur "web" : sert la SPA React et aiguille
# /api → backend PHP-FPM, /.well-known/mercure → hub Mercure.

# Transmet l'info HTTPS à Symfony (le TLS est terminé par le nginx de l'hôte).
map $http_x_forwarded_proto $fcgi_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # --- API Symfony (PHP-FPM) -------------------------------------------
    location ^~ /api {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_read_timeout 60;
    }

    # --- Hub Mercure (SSE temps réel, connexions longues) ----------------
    location /.well-known/mercure {
        # DNS interne de Docker : indispensable car proxy_pass utilise une
        # variable (résolution du nom "mercure" au moment de la requête).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mercure_backend http://mercure:80;
        proxy_pass $mercure_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # --- Assets versionnés (cache long) ----------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA React (fallback vers index.html pour le routing client) ------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
