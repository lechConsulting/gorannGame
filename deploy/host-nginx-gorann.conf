# Vhost à installer sur l'HÔTE (le nginx qui gère déjà tes autres sites).
# Il ne fait qu'AJOUTER le domaine gorann : aucun site existant n'est modifié.
#
# Installation :
#   sudo cp deploy/host-nginx-gorann.conf /etc/nginx/sites-available/gorann
#   sudo ln -s /etc/nginx/sites-available/gorann /etc/nginx/sites-enabled/gorann
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gorann.games.lechat-consulting.fr   # ajoute le HTTPS
#
# Après certbot, ce bloc est complété automatiquement (443 + redirection).

server {
    listen 80;
    listen [::]:80;
    server_name gorann.games.lechat-consulting.fr;

    # Reverse-proxy vers la stack Docker (exposée sur 127.0.0.1:8090).
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Support SSE (Mercure) : connexions longues, pas de bufferisation.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
